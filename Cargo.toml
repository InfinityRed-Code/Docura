[workspace]
resolver = "2"
members = [
    "crates/pdf_types",
    "crates/pdf_core",
    "crates/pdf_pdfium",
    "crates/pdf_services",
    "crates/pdf_cache",
    "crates/pdf_mutate",
    "crates/pdf_sign",
    "crates/pdf_export",
    "crates/pdf_fonts",
    "apps/desktop-tauri/src-tauri",
]

[workspace.package]
version = "1.3.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
lopdf = "0.38"
pdfium-render = "0.8"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "webp", "ico"] }

pdf_types = { path = "crates/pdf_types" }
pdf_core = { path = "crates/pdf_core" }
pdf_pdfium = { path = "crates/pdf_pdfium" }
pdf_services = { path = "crates/pdf_services" }
pdf_cache = { path = "crates/pdf_cache" }
pdf_mutate = { path = "crates/pdf_mutate" }
pdf_sign = { path = "crates/pdf_sign" }
pdf_export = { path = "crates/pdf_export" }
pdf_fonts = { path = "crates/pdf_fonts" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Optimize third-party crates even in dev builds so JPEG encode / image work
# isn't crippled by unoptimized deps. Workspace code stays at opt-level 0
# for fast incremental builds.
[profile.dev.package."*"]
opt-level = 3

# The render-proxy decoder (inflate + PNG unfilter + downsample of huge
# scans) is pure per-byte loops: unoptimised it is ~10× slower, which makes
# opening scanned plans in `tauri dev` painfully slow.
[profile.dev.package.pdf_pdfium]
opt-level = 3
